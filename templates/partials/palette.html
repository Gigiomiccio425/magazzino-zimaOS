<dialog class="mag-dialog palette" id="palette" aria-label="Ricerca globale">
  <div class="palette__box">
    <label class="sr-only" for="palette-input">Cerca ovunque</label>
    <input type="search" id="palette-input" class="input palette__input" placeholder="Cerca componenti, tag, servizi, incidenti…"
           role="combobox" aria-expanded="false" aria-controls="palette-list" aria-autocomplete="list" autocomplete="off">
    <ul class="palette__list" id="palette-list" role="listbox" aria-label="Risultati"></ul>
    <p class="palette__hint muted">&uarr; &darr; per muoverti · Invio per aprire · Esc per chiudere</p>
  </div>
</dialog>
