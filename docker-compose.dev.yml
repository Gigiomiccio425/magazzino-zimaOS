# Variante SVILUPPO: builda l'immagine dai sorgenti locali.
#   docker compose -f docker-compose.dev.yml up -d --build
services:
  magazzino:
    build: .
    image: magazzino-hardware:local
    container_name: magazzino-dev
    ports:
      - "8086:8000"
    environment:
      - APP_NAME=${APP_NAME:-MAGAZZINO}
      - SECRET_KEY=${SECRET_KEY:-}
      - TZ=${TZ:-Europe/Rome}
      - DATA_DIR=/data
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      - WEBAUTHN_RP_ID=${WEBAUTHN_RP_ID:-}
    volumes:
      - ./data:/data
    restart: unless-stopped
