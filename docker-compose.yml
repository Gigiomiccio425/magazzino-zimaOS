# ============================================================
# GD MAGAZZINO 2.0 — installazione standalone (ZimaOS / Docker Compose)
# Su Umbrel si usa l'app store "Gigio-dany-appstore" (login Umbrel incluso).
#
# Aggiornamenti controllati: la versione e' FISSATA qui sotto (:2.0.1).
# Prima di ogni aggiornamento l'app fa da sola un backup del database
# in /data/backups/pre-migrazione/.
#
# ATTENZIONE: la v2 non ha piu' una password propria. Tienila dietro un
# proxy con autenticazione (es. login Umbrel, Authelia, Tailscale) e non
# esporla direttamente su internet.
# ============================================================
services:
  magazzino:
    image: ghcr.io/gigiomiccio425/magazzino-zimaos:2.0.1
    container_name: magazzino
    pull_policy: always
    ports:
      - "8086:8000"
    environment:
      - APP_NAME=${APP_NAME:-MAGAZZINO}
      - SECRET_KEY=${SECRET_KEY:-}
      - TZ=${TZ:-Europe/Rome}
      - DATA_DIR=/data
      # URL usato nei QR delle etichette e nei link Discord (facoltativo)
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      # Dominio fisso per le passkey/impronte (facoltativo: di default l'host della richiesta)
      - WEBAUTHN_RP_ID=${WEBAUTHN_RP_ID:-}
    volumes:
      - /DATA/AppData/magazzino:/data
    restart: unless-stopped
